<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitch Deck AI Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --bg-light: #1e293b;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            animation: pulse 15s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.5) translate(-10%, 10%); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .upload-section {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 50px;
            border: 2px dashed var(--border);
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out 0.2s both;
            position: relative;
            overflow: hidden;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .upload-section:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.3);
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .file-input-wrapper {
            position: relative;
            margin: 30px 0;
        }

        input[type="file"] {
            opacity: 0;
            position: absolute;
            z-index: -1;
        }

        .file-input-label {
            display: block;
            padding: 20px;
            background: var(--bg-dark);
            border: 2px solid var(--border);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .file-input-label:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .file-name {
            margin-top: 15px;
            color: var(--secondary);
            font-size: 0.9rem;
            text-align: center;
            min-height: 20px;
        }

        .output-options {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .option-btn {
            padding: 12px 24px;
            background: var(--bg-dark);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .option-btn:hover {
            border-color: var(--primary);
            color: var(--text-primary);
        }

        .option-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .analyze-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .analyze-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .analyze-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .analyze-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results-section {
            margin-top: 40px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .status-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .status-card.success {
            border-left-color: var(--secondary);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, transparent 100%);
        }

        .status-card.error {
            border-left-color: var(--danger);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, transparent 100%);
        }

        .status-card.loading {
            border-left-color: var(--warning);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, transparent 100%);
        }

        .pdf-viewer-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
            border: 2px solid var(--border);
        }

        .pdf-viewer {
            width: 100%;
            height: 800px;
            border: none;
            border-radius: 12px;
            background: white;
        }

        .score-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .score-circle {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .score-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
            justify-content: center;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .action-btn.primary {
            background: var(--secondary);
            color: white;
        }

        .action-btn.primary:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
        }

        .action-btn.secondary {
            background: var(--primary);
            color: white;
        }

        .action-btn.secondary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .metric-card {
            background: var(--bg-dark);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .metric-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            .upload-section {
                padding: 30px 20px;
            }
            .score-circle {
                width: 120px;
                height: 120px;
            }
            .output-options {
                flex-direction: column;
            }
            .option-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Pitch Deck AI Analyzer</h1>
            <p class="subtitle">Transform your pitch deck into actionable insights with AI-powered analysis</p>
            <div style="margin-top: 20px;">
                <button onclick="downloadLatestReport()" class="action-btn secondary" style="font-size: 0.9rem; padding: 10px 20px;">
                    📥 Download Latest Report
                </button>
            </div>
        </header>

        <div class="upload-section">
            <span class="upload-icon">📄</span>
            <form id="uploadForm">
                <div class="file-input-wrapper">
                    <input type="file" id="pdfFile" name="file" accept=".pdf" required>
                    <label for="pdfFile" class="file-input-label">
                        📎 Choose PDF Pitch Deck
                    </label>
                    <div class="file-name" id="fileName">No file selected</div>
                </div>

                <div class="output-options">
                    <label class="option-btn active">
                        <input type="radio" name="outputType" value="pdf" checked style="display: none;">
                        📄 PDF Report
                    </label>
                    <label class="option-btn">
                        <input type="radio" name="outputType" value="json" style="display: none;">
                        📊 JSON + Preview
                    </label>
                </div>

                <button type="submit" class="analyze-btn" id="submitBtn">
                    <span id="btnText">Analyze Pitch Deck</span>
                </button>
            </form>
        </div>

        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="status-card" id="statusCard">
                <h2 id="statusTitle">Analysis Status</h2>
                <p id="statusMessage"></p>
            </div>

            <div id="pdfResults" style="display: none;">
                <div class="action-buttons">
                    <a href="#" id="downloadPdfBtn" class="action-btn primary" download>
                        📥 Download PDF Report
                    </a>
                    <button onclick="downloadFromBackend()" class="action-btn primary">
                        💾 Download from Server
                    </button>
                    <button onclick="openPdfNewTab()" class="action-btn secondary">
                        🔗 Open in New Tab
                    </button>
                    <button onclick="resetAnalysis()" class="action-btn secondary">
                        🔄 Analyze Another
                    </button>
                </div>
                <div class="pdf-viewer-container">
                    <h3 style="color: var(--primary); margin-bottom: 20px; text-align: center;">
                        📊 Analysis Report Preview
                    </h3>
                    <iframe id="pdfViewer" class="pdf-viewer"></iframe>
                </div>
            </div>

            <div id="jsonResults" style="display: none;">
                <div class="score-display">
                    <div class="score-circle">
                        <svg width="150" height="150" viewBox="0 0 150 150">
                            <circle cx="75" cy="75" r="65" fill="none" stroke="#334155" stroke-width="10"/>
                            <circle id="scoreCircle" cx="75" cy="75" r="65" fill="none" stroke="url(#gradient)" stroke-width="10" 
                                    stroke-linecap="round" transform="rotate(-90 75 75)" 
                                    stroke-dasharray="408.4" stroke-dashoffset="408.4"/>
                            <defs>
                                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#6366f1"/>
                                    <stop offset="100%" style="stop-color:#10b981"/>
                                </linearGradient>
                            </defs>
                        </svg>
                        <div class="score-value" id="scoreValue">0</div>
                    </div>
                </div>

                <div class="metric-grid" id="metricsGrid"></div>

                <div class="action-buttons">
                    <a href="#" id="downloadPdfLink" class="action-btn primary" download>
                        📄 Download PDF Report
                    </a>
                    <a href="#" id="downloadJsonLink" class="action-btn secondary" download>
                        📥 Download JSON
                    </a>
                    <button onclick="resetAnalysis()" class="action-btn secondary">
                        🔄 Analyze Another
                    </button>
                </div>

                <div style="background: var(--card-bg); padding: 30px; border-radius: 16px; margin-top: 20px;">
                    <h3 style="color: var(--primary); margin-bottom: 20px;">📋 Analysis Summary</h3>
                    <div id="summaryContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        let currentPdfUrl = null;
        let currentData = null;
        let currentAnalysisId = null;

        // Debug function
        function debugLog(message, data) {
            console.log(`[DEBUG] ${message}`, data || '');
        }

        // Handle output type selection
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        document.getElementById('pdfFile').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name || 'No file selected';
            document.getElementById('fileName').textContent = fileName;
        });

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('pdfFile');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a PDF file');
                return;
            }

            debugLog('File selected:', file.name);

            const outputType = document.querySelector('input[name="outputType"]:checked').value;
            debugLog('Output type:', outputType);

            const formData = new FormData();
            formData.append('file', file);

            showLoading();

            try {
                if (outputType === 'pdf') {
                    debugLog('Fetching PDF from backend...');
                    
                    // Fetch PDF directly
                    const response = await fetch(`${API_BASE}/api/analyze?return_json=false`, {
                        method: 'POST',
                        body: formData
                    });

                    debugLog('Response status:', response.status);
                    debugLog('Response headers:', {
                        contentType: response.headers.get('Content-Type'),
                        analysisId: response.headers.get('X-Analysis-ID'),
                        score: response.headers.get('X-Overall-Score')
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        debugLog('Error response:', errorText);
                        let error;
                        try {
                            error = JSON.parse(errorText);
                        } catch {
                            error = { detail: errorText };
                        }
                        throw new Error(error.detail || 'Analysis failed');
                    }

                    // Get the PDF blob
                    const blob = await response.blob();
                    debugLog('Blob received:', { size: blob.size, type: blob.type });
                    
                    if (blob.size === 0) {
                        throw new Error('Received empty PDF file');
                    }

                    const pdfUrl = URL.createObjectURL(blob);
                    currentPdfUrl = pdfUrl;
                    debugLog('PDF URL created:', pdfUrl);

                    // Get metadata from headers
                    const analysisId = response.headers.get('X-Analysis-ID');
                    const overallScore = response.headers.get('X-Overall-Score');
                    
                    // Store analysis ID for backend download
                    currentAnalysisId = analysisId;

                    debugLog('✅ PDF received successfully:', { analysisId, overallScore, blobSize: blob.size });
                    
                    // Auto-download the PDF from backend
                    if (analysisId) {
                        debugLog('Auto-downloading PDF from backend...');
                        await autoDownloadFromBackend(analysisId);
                    }
                    
                    displayPdfResults(pdfUrl, analysisId, overallScore);

                } else {
                    debugLog('Fetching JSON from backend...');
                    
                    // Fetch JSON with metadata
                    const response = await fetch(`${API_BASE}/api/analyze?return_json=true`, {
                        method: 'POST',
                        body: formData
                    });

                    debugLog('JSON response status:', response.status);

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'Analysis failed');
                    }

                    const data = await response.json();
                    debugLog('✅ Analysis completed:', data);
                    
                    // Store analysis ID
                    currentAnalysisId = data.analysis_id;
                    
                    // Fetch full analysis data
                    const analysisResponse = await fetch(`${API_BASE}/api/analysis/${data.analysis_id}`);
                    const fullData = await analysisResponse.json();
                    
                    currentData = fullData;
                    displayJsonResults(fullData, data.analysis_id);
                }

            } catch (error) {
                console.error('❌ Analysis error:', error);
                debugLog('Error details:', error);
                showError(error.message);
            }
        });

        function showLoading() {
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('btnText').innerHTML = '<span class="loading-spinner"></span> Analyzing...';
            
            document.getElementById('resultsSection').style.display = 'block';
            const statusCard = document.getElementById('statusCard');
            statusCard.className = 'status-card loading';
            document.getElementById('statusTitle').textContent = '⏳ Analysis in Progress';
            document.getElementById('statusMessage').textContent = 'AI is processing your pitch deck...';
            
            document.getElementById('pdfResults').style.display = 'none';
            document.getElementById('jsonResults').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('btnText').textContent = 'Analyze Pitch Deck';
            
            const statusCard = document.getElementById('statusCard');
            statusCard.className = 'status-card error';
            document.getElementById('statusTitle').textContent = '❌ Analysis Failed';
            document.getElementById('statusMessage').textContent = message;
        }

        function displayPdfResults(pdfUrl, analysisId, score) {
            debugLog('Displaying PDF results:', { pdfUrl, analysisId, score });
            
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('btnText').textContent = 'Analyze Pitch Deck';
            
            const statusCard = document.getElementById('statusCard');
            statusCard.className = 'status-card success';
            document.getElementById('statusTitle').textContent = '✅ Analysis Complete';
            document.getElementById('statusMessage').innerHTML = `
                Your pitch deck has been analyzed successfully!
                ${score ? `<br><strong>Overall Score: ${score}/100</strong>` : ''}
                ${analysisId ? `<br><small>Analysis ID: ${analysisId}</small>` : ''}
            `;
            
            document.getElementById('pdfResults').style.display = 'block';
            document.getElementById('jsonResults').style.display = 'none';

            // Set up PDF viewer (using blob for preview)
            const pdfViewer = document.getElementById('pdfViewer');
            pdfViewer.src = pdfUrl;
            debugLog('PDF viewer src set to:', pdfUrl);

            // Add load event listener to verify PDF loaded
            pdfViewer.onload = function() {
                debugLog('PDF loaded in iframe successfully');
            };
            
            pdfViewer.onerror = function(e) {
                debugLog('Error loading PDF in iframe:', e);
                showError('Failed to display PDF preview. Try downloading instead.');
            };

            // Set up download button to download from backend
            const downloadBtn = document.getElementById('downloadPdfBtn');
            if (analysisId) {
                // Download from backend API
                const backendUrl = `${API_BASE}/api/report/${analysisId}`;
                downloadBtn.href = backendUrl;
                downloadBtn.download = `pitch_deck_analysis_${analysisId}.pdf`;
                debugLog('Download button configured:', backendUrl);
            } else {
                // Fallback to blob if no analysis ID
                downloadBtn.href = pdfUrl;
                downloadBtn.download = `pitch_deck_analysis_report.pdf`;
                debugLog('Download button using blob URL (no analysis ID)');
            }
        }

        function displayJsonResults(data, analysisId) {
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('btnText').textContent = 'Analyze Pitch Deck';
            
            const statusCard = document.getElementById('statusCard');
            statusCard.className = 'status-card success';
            document.getElementById('statusTitle').textContent = '✅ Analysis Complete';
            document.getElementById('statusMessage').textContent = 'Your pitch deck has been analyzed successfully!';
            
            document.getElementById('pdfResults').style.display = 'none';
            document.getElementById('jsonResults').style.display = 'block';

            // Animate score
            animateScore(data.overall_score);
            
            // Display metrics
            displayMetrics(data);
            
            // Display summary
            displaySummary(data);

            // Set up download links
            const downloadPdfLink = document.getElementById('downloadPdfLink');
            downloadPdfLink.href = `${API_BASE}/api/report/${analysisId}`;
            downloadPdfLink.download = `pitch_deck_analysis_${analysisId}.pdf`;

            const downloadJsonLink = document.getElementById('downloadJsonLink');
            downloadJsonLink.href = `${API_BASE}/api/analyses/${analysisId}`;
            downloadJsonLink.download = `pitch_deck_analysis_${analysisId}.json`;
        }

        function animateScore(score) {
            const circle = document.getElementById('scoreCircle');
            const value = document.getElementById('scoreValue');
            const circumference = 408.4;
            const offset = circumference - (score / 100) * circumference;
            
            let current = 0;
            const duration = 2000;
            const steps = 60;
            const increment = score / steps;
            const stepDuration = duration / steps;

            const interval = setInterval(() => {
                current += increment;
                if (current >= score) {
                    current = score;
                    clearInterval(interval);
                }
                value.textContent = Math.round(current);
            }, stepDuration);

            setTimeout(() => {
                circle.style.transition = 'stroke-dashoffset 2s ease-out';
                circle.style.strokeDashoffset = offset;
            }, 100);
        }

        function displayMetrics(data) {
            const metricsGrid = document.getElementById('metricsGrid');
            const categoryScores = data.category_scores || {};
            
            const metrics = [
                { label: 'Problem', value: categoryScores.problem || 0, icon: '🎯' },
                { label: 'Solution', value: categoryScores.solution || 0, icon: '💡' },
                { label: 'Market', value: categoryScores.market || 0, icon: '📊' },
                { label: 'Business Model', value: categoryScores.business_model || 0, icon: '💰' },
                { label: 'Team', value: categoryScores.team || 0, icon: '👥' },
                { label: 'Traction', value: categoryScores.traction || 0, icon: '🚀' }
            ];

            metricsGrid.innerHTML = metrics.map(m => `
                <div class="metric-card">
                    <div style="font-size: 2rem; text-align: center; margin-bottom: 10px;">${m.icon}</div>
                    <div class="metric-label">${m.label}</div>
                    <div class="metric-value">${m.value.toFixed(1)}</div>
                </div>
            `).join('');
        }

        function displaySummary(data) {
            const summaryContent = document.getElementById('summaryContent');
            const summary = data.executive_summary || 'Analysis complete.';
            
            let html = `
                <p style="line-height: 1.8; color: var(--text-secondary); margin-bottom: 30px;">${summary}</p>
            `;
                
            if (data.strengths && data.strengths.length > 0) {
                html += `
                    <h4 style="color: var(--secondary); margin: 20px 0 15px;">💪 Key Strengths</h4>
                    <ul style="list-style: none; padding: 0;">
                        ${data.strengths.slice(0, 3).map(strength => `
                            <li style="padding: 12px 15px; margin: 8px 0; background: var(--bg-dark); 
                                       border-radius: 8px; border-left: 3px solid var(--secondary);
                                       color: var(--text-secondary); line-height: 1.6;">
                                <span style="color: var(--secondary); margin-right: 10px;">✓</span>${strength}
                            </li>
                        `).join('')}
                    </ul>
                `;
            }
                
            if (data.recommendations && data.recommendations.length > 0) {
                html += `
                    <h4 style="color: var(--primary); margin: 20px 0 15px;">💡 Top Recommendations</h4>
                    <ul style="list-style: none; padding: 0;">
                        ${data.recommendations.slice(0, 3).map((rec, i) => `
                            <li style="padding: 12px 15px; margin: 8px 0; background: var(--bg-dark); 
                                       border-radius: 8px; border-left: 3px solid var(--primary);
                                       color: var(--text-secondary); line-height: 1.6;">
                                <span style="color: var(--primary); font-weight: 700; margin-right: 10px;">${i + 1}.</span>${rec}
                            </li>
                        `).join('')}
                    </ul>
                `;
            }
            
            summaryContent.innerHTML = html;
        }

        function openPdfNewTab() {
            if (currentAnalysisId) {
                // Open backend PDF in new tab
                window.open(`${API_BASE}/api/report/${currentAnalysisId}`, '_blank');
            } else if (currentPdfUrl) {
                // Fallback to blob URL
                window.open(currentPdfUrl, '_blank');
            }
        }

        async function downloadFromBackend() {
            if (!currentAnalysisId) {
                alert('No analysis ID found. Please try analyzing again.');
                return;
            }

            try {
                console.log('Downloading from backend:', currentAnalysisId);
                
                // Fetch the PDF from backend
                const response = await fetch(`${API_BASE}/api/report/${currentAnalysisId}`);
                
                if (!response.ok) {
                    throw new Error(`Failed to download: ${response.statusText}`);
                }

                // Get the blob
                const blob = await response.blob();
                console.log('Downloaded blob size:', blob.size);

                // Create download link
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pitch_deck_analysis_${currentAnalysisId}.pdf`;
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);

                console.log('✅ Download initiated successfully');
                
                // Show success message
                const statusMessage = document.getElementById('statusMessage');
                const originalMessage = statusMessage.innerHTML;
                statusMessage.innerHTML += '<br><span style="color: var(--secondary);">✓ Downloaded from server successfully!</span>';
                
                setTimeout(() => {
                    statusMessage.innerHTML = originalMessage;
                }, 3000);

            } catch (error) {
                console.error('Download error:', error);
                alert(`Failed to download from server: ${error.message}`);
            }
        }

        async function autoDownloadFromBackend(analysisId) {
            try {
                debugLog('Auto-downloading from backend:', analysisId);
                
                // Fetch the PDF from backend
                const response = await fetch(`${API_BASE}/api/report/${analysisId}`);
                
                if (!response.ok) {
                    throw new Error(`Auto-download failed: ${response.statusText}`);
                }

                // Get the blob
                const blob = await response.blob();
                debugLog('Auto-download blob received:', blob.size);

                // Create download link and trigger download
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pitch_deck_analysis_${analysisId}.pdf`;
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);

                debugLog('✅ Auto-download completed successfully');

            } catch (error) {
                console.error('Auto-download error:', error);
                // Don't show alert for auto-download failures, just log it
                debugLog('Auto-download failed, user can use manual download buttons');
            }
        }

        async function downloadLatestReport() {
            try {
                console.log('Fetching latest report from backend...');
                
                // Fetch the latest PDF from backend
                const response = await fetch(`${API_BASE}/api/latest-report`);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        alert('No reports found. Please analyze a pitch deck first.');
                    } else {
                        throw new Error(`Failed to download: ${response.statusText}`);
                    }
                    return;
                }

                // Get analysis ID from header
                const latestAnalysisId = response.headers.get('X-Analysis-ID');
                console.log('Latest report analysis ID:', latestAnalysisId);

                // Get the blob
                const blob = await response.blob();
                console.log('Downloaded latest report blob size:', blob.size);

                // Create download link
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `latest_pitch_deck_analysis.pdf`;
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);

                console.log('✅ Latest report downloaded successfully');

            } catch (error) {
                console.error('Download latest report error:', error);
                alert(`Failed to download latest report: ${error.message}`);
            }
        }

        function resetAnalysis() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('pdfFile').value = '';
            document.getElementById('fileName').textContent = 'No file selected';
            
            if (currentPdfUrl) {
                URL.revokeObjectURL(currentPdfUrl);
                currentPdfUrl = null;
            }
            currentData = null;
            currentAnalysisId = null;
        }
    </script>
</body>
</html>
